<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sacred Prayer</title>
<meta name="description" content="The Lost Prayer of Solomon, the Manuscript of Solomon and prayers for everyday life.">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B111E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sacred Prayer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width app column, lapis header panel, bottom tab bar; reading views use a parchment-free serif page with gold liturgical rubrics */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#16203A; --muted:#58637D; --line:#D7DDE8;
  --lapis:#22409A; --lapis-deep:#172C6B; --lapis-soft:#E2E8F7; --gold:#A0731A; --gold-bright:#D8AA4A; --gold-soft:#F4EAD0;
  --on-lapis:#F4F1E8; --good:#2F7A4E;
  --display:"Marcellus","Trajan Pro",Georgia,serif;
  --read:"Literata",Georgia,"Times New Roman",serif;
  --ui:"Figtree","Segoe UI",system-ui,sans-serif;
  --fs:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B111E; --surface:#131B2D; --ink:#E8EBF2; --muted:#9BA5BD; --line:#253049;
  --lapis:#8EA6EE; --lapis-deep:#1A2754; --lapis-soft:#1A2441; --gold:#DDB35E; --gold-bright:#E8C273; --gold-soft:#2C2616;
  --on-lapis:#F1ECDD; --good:#6CC08F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B111E; --surface:#131B2D; --ink:#E8EBF2; --muted:#9BA5BD; --line:#253049;
  --lapis:#8EA6EE; --lapis-deep:#1A2754; --lapis-soft:#1A2441; --gold:#DDB35E; --gold-bright:#E8C273; --gold-soft:#2C2616;
  --on-lapis:#F1ECDD; --good:#6CC08F; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
img,svg{max-width:100%}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.25rem}
.seal{width:30px;height:30px;flex:none}
.tools{display:flex;gap:6px}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:.85rem;font-weight:600}

/* hero panel */
.hero{background:var(--lapis-deep);color:var(--on-lapis);border-radius:20px;padding:22px 20px 20px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:200px;height:200px;border-radius:50%;border:1px solid rgba(216,170,74,.25);box-shadow:0 0 0 18px rgba(216,170,74,.06),0 0 0 40px rgba(216,170,74,.04)}
.hero .eyebrow{color:var(--gold-bright)}
.hero h1{font-size:1.75rem;line-height:1.15}
.hero p{margin:0;opacity:.88;max-width:40ch}
.lamps{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.lamp{display:grid;justify-items:center;gap:4px;font-size:.7rem;font-variant-numeric:tabular-nums;opacity:.9}
.flame{width:14px;height:14px;border-radius:50% 0 50% 50%;transform:rotate(-45deg);border:1.5px solid rgba(241,236,221,.45);margin-top:4px}
.lamp.lit .flame{background:var(--gold-bright);border-color:var(--gold-bright);box-shadow:0 0 12px rgba(232,194,115,.7)}
.lamp.today .flame{border-color:var(--gold-bright);border-style:dashed}
.cta{justify-self:start;background:var(--gold-bright);color:#1B1606;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:1rem}

section.block{display:grid;gap:12px;margin-top:26px}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.block-head h2{font-size:1.3rem}
.link{background:none;border:0;color:var(--lapis);font-weight:600;padding:0}

.pillars{display:grid;gap:10px}
.pillar{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.numeral{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.15rem;color:var(--gold);border:1.5px solid var(--gold);background:var(--gold-soft)}
.pillar strong{display:block;font-size:1.02rem}
.pillar span{color:var(--muted);font-size:.88rem}
.chev{color:var(--muted);font-size:1.3rem}

.bonus-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bonus-tile{background:var(--lapis-soft);border:0;border-radius:14px;padding:12px 10px;text-align:left;display:grid;gap:4px;min-width:0}
.bonus-tile b{font-size:.9rem;line-height:1.2}
.bonus-tile small{color:var(--muted);font-size:.75rem}

/* lists */
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:14px;background:none;border:0;border-top:1px solid var(--line);width:100%}
.row:first-child{border-top:0}
.row .idx{font-family:var(--display);color:var(--gold);min-width:1.6em;font-variant-numeric:tabular-nums}
.row strong{display:block;font-weight:600}
.row span{color:var(--muted);font-size:.86rem}
.state{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.state.done{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.state.next{background:var(--gold-soft);color:var(--gold)}
.fav-mark{color:var(--gold)}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem}
.tabs button[aria-pressed="true"]{background:var(--lapis);border-color:var(--lapis);color:var(--surface)}
.note{background:var(--gold-soft);border-radius:12px;padding:12px 14px;font-size:.88rem;color:var(--ink)}
.intro{color:var(--muted);margin:0;max-width:60ch}
.page-title{display:grid;gap:6px;margin-top:6px}
.page-title h1{font-size:1.7rem}

/* reader */
.reader{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.reader-inner{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
.reader-bar{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding-block:12px;gap:8px;z-index:2}
.reader h1{font-size:calc(1.75rem * var(--fs));line-height:1.2;margin-top:8px}
.verse{margin:18px 0 6px;padding:14px 16px;border-left:3px solid var(--gold);background:var(--surface);border-radius:0 12px 12px 0;font-family:var(--read);font-style:italic;font-size:calc(1rem * var(--fs))}
.verse cite{display:block;margin-top:6px;font-style:normal;font-family:var(--ui);font-size:.8rem;font-weight:600;color:var(--gold);letter-spacing:.04em}
.text{font-family:var(--read);font-size:calc(1.12rem * var(--fs));line-height:1.75;max-width:62ch}
.text p{margin:0 0 1em}
.text .rubric{font-family:var(--ui);font-style:italic;color:var(--gold);font-size:.92em}
.text .petition{padding-left:14px;border-left:2px solid var(--lapis)}
.text h3{font-size:1.15em;margin:1.4em 0 .4em;color:var(--lapis)}
.text ul,.text ol{padding-left:1.2em;margin:0 0 1em}
.amen{font-family:var(--display);font-size:1.3em;color:var(--gold)}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.actions-inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border-radius:12px;padding:12px 14px;font-weight:700;border:1.5px solid var(--lapis);background:transparent;color:var(--lapis)}
.btn.primary{background:var(--lapis);color:var(--surface)}
.btn.done{border-color:var(--good);background:transparent;color:var(--good)}

/* bottom nav */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.bar .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bar button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:.7rem;font-weight:600;color:var(--muted)}
nav.bar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.bar button[aria-current="page"]{color:var(--lapis)}

/* install card + guide */
.install{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;background:var(--surface);border:1.5px solid var(--gold);border-radius:16px;padding:14px;margin-top:14px}
.install img{width:52px;height:52px;border-radius:12px}
.install strong{display:block;font-size:1rem}
.install span{color:var(--muted);font-size:.86rem}
.install .btn{grid-column:1/-1}
.chip-btn.gold{border-color:var(--gold);color:var(--gold)}
.guide{display:grid;gap:16px;margin-top:8px}
.guide h1{font-size:1.6rem}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--lapis-soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--lapis);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:1rem;line-height:1.45}
.steps li::before{content:counter(st);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--lapis);color:var(--surface);font-weight:700;font-variant-numeric:tabular-nums}
.steps b{font-weight:700}
.steps small{display:block;color:var(--muted);font-size:.85rem;margin-top:4px}
.ico{display:inline-grid;place-items:center;vertical-align:-6px;width:26px;height:26px;border:1px solid var(--line);border-radius:7px;background:var(--bg);margin-inline:2px}
.ico svg{width:17px;height:17px;stroke:var(--lapis);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico svg .dot{fill:var(--lapis);stroke:none}
.alert{background:color-mix(in srgb,#C0392B 12%,var(--surface));border:1px solid color-mix(in srgb,#C0392B 40%,transparent);border-radius:12px;padding:12px 14px;font-size:.92rem}
.copybox{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px}
.copybox code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:40}

/* support button + page */
.fab{position:fixed;z-index:15;right:max(16px,calc(50% - 280px + 16px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--lapis);color:var(--surface);display:grid;place-items:center;box-shadow:0 6px 18px rgba(23,44,107,.35)}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab:active{transform:scale(.95)}
.mailcard{display:grid;gap:12px;background:var(--surface);border:1.5px solid var(--gold);border-radius:16px;padding:16px}
.mailcard .addr{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere;user-select:all}
.mailcard .row2{display:flex;gap:10px;flex-wrap:wrap}
.mailcard .row2 > *{flex:1 1 140px;text-align:center;text-decoration:none}
.faq{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.faq details{border-top:1px solid var(--line)}
.faq details:first-child{border-top:0}
.faq summary{cursor:pointer;padding:14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--gold);font-weight:700}
.faq details[open] summary::after{content:"−"}
.faq details p{margin:0;padding:0 14px 14px;color:var(--muted)}

/* song player */
.player{background:var(--lapis-deep);color:var(--on-lapis);border-radius:20px;padding:22px;display:grid;gap:16px;justify-items:center;text-align:center}
.disc{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--gold-bright) 0 7%,transparent 8%),repeating-radial-gradient(circle,rgba(232,194,115,.22) 0 2px,transparent 2px 9px);border:1px solid rgba(232,194,115,.4)}
.playing .disc{animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.play{width:64px;height:64px;border-radius:50%;border:0;background:var(--gold-bright);color:#1B1606;font-size:1.4rem;font-weight:700}
.track{width:100%;height:4px;background:rgba(241,236,221,.2);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--gold-bright)}
.times{width:100%;display:flex;justify-content:space-between;font-size:.8rem;font-variant-numeric:tabular-nums;opacity:.8}
.species{display:flex;flex-wrap:wrap;gap:6px}
.species span{background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600}
.cover{background:var(--lapis-deep);color:var(--on-lapis);border-radius:16px;padding:26px 20px;text-align:center;display:grid;gap:8px;border:1px solid var(--gold-bright)}
.cover .eyebrow{color:var(--gold-bright)}
.cover h2{font-size:1.6rem}
@media (prefers-reduced-motion:reduce){.playing .disc{animation:none}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="seal" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="none" stroke="var(--gold)" stroke-width="1.5"/><path d="M16 5 25.5 21.5h-19Z M16 27 6.5 10.5h19Z" fill="none" stroke="var(--gold)" stroke-width="1.3"/></svg>
      Sacred Prayer
    </div>
    <div class="tools">
      <button class="chip-btn gold" id="hdr-install" data-install hidden>Install</button>
      <button class="chip-btn" id="fs-down" aria-label="Smaller text">A−</button>
      <button class="chip-btn" id="fs-up" aria-label="Larger text">A+</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="bar" aria-label="Main">
  <div class="inner">
    <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Home</button>
    <button data-tab="lost"><svg viewBox="0 0 24 24"><path d="M12 3c2 3 4 4.5 4 7.5a4 4 0 0 1-8 0C8 7.5 10 6 12 3z"/><path d="M8 21h8M12 14.5V21"/></svg>7 Days</button>
    <button data-tab="manuscript"><svg viewBox="0 0 24 24"><path d="M6 3h10a2 2 0 0 1 2 2v14a2 2 0 0 0 2 2H8a2 2 0 0 1-2-2z"/><path d="M6 7H4v12a2 2 0 0 0 2 2M10 8h5M10 12h5"/></svg>Manuscript</button>
    <button data-tab="prayers"><svg viewBox="0 0 24 24"><path d="M12 20V9M12 9c-2-3-6-3-8-2v11c2-1 6-1 8 2 2-3 6-3 8-2V7c-2-1-6-1-8 2z"/></svg>Prayers</button>
    <button data-tab="bonus"><svg viewBox="0 0 24 24"><path d="M4 10h16v10H4zM3 7h18v3H3zM12 7v13M12 7C10 3 6 4 7.5 7M12 7c2-4 6-3 4.5 0"/></svg>Gifts</button>
  </div>
</nav>

<button class="fab" id="fab-support" aria-label="Support by email">
  <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
</button>

<div class="reader" id="reader" hidden>
  <div class="reader-inner">
    <div class="reader-bar">
      <button class="chip-btn" id="reader-back">← Back</button>
      <div class="tools">
        <button class="chip-btn" id="r-fs-down" aria-label="Smaller text">A−</button>
        <button class="chip-btn" id="r-fs-up" aria-label="Larger text">A+</button>
      </div>
    </div>
    <article id="reader-body"></article>
  </div>
  <div class="actions"><div class="actions-inner" id="reader-actions"></div></div>
</div>

<script>
/* ---------- CONTENT ---------- */
const CORE = `Lord, God of Israel, there is no God like You in heaven above or on the earth below. You keep Your covenant and Your mercy with those who walk before You with all their heart.

As You heard Your servant Solomon, hear me now. I come small before You, but I come with faith. Give me an understanding heart, to know Your voice and to follow it.

Let Your eyes be open toward my house night and day. Hear from heaven, Your dwelling place, and when You hear, forgive.

{PETITION}

Where there is weakness, bring Your strength. Where there is worry, bring Your care. Where there is division, bring Your peace. Guide my steps on the right path, and keep me from every path that leads me away from You.

Into Your hands I place my request:

~Pause here. Tell God your need in your own words, slowly, with your whole heart.

I receive Your answer with faith, in Your time and in Your way. Blessed be the Lord, who gives rest to His people. Not one word of all His good promise has ever failed.`;

const DAYS = [
 {t:"Surrender",v:"Commit thy works unto the LORD, and thy thoughts shall be established.",ref:"Proverbs 16:3",
  focus:"Today you place your whole life in God's hands. Before you pray, think of the one burden you carry most.",
  p:"Lord, today I lay my burden at Your feet. I stop carrying alone what You never asked me to carry alone."},
 {t:"Wisdom",v:"Give therefore thy servant an understanding heart.",ref:"1 Kings 3:9",
  focus:"Solomon asked for wisdom before anything else. Today, ask God to show you the right path.",
  p:"Give me, as You gave Solomon, a listening heart, so I can see my path clearly and choose what pleases You."},
 {t:"Forgiveness",v:"Hear thou in heaven thy dwelling place: and when thou hearest, forgive.",ref:"1 Kings 8:30",
  focus:"Unforgiveness ties the heart. Today, release your own faults and the faults of others into God's mercy.",
  p:"Forgive what I have done wrong, Lord, and give me strength to forgive those who wounded me. Untie my heart."},
 {t:"Strength",v:"A merry heart doeth good like a medicine.",ref:"Proverbs 17:22",
  focus:"Today, bring your body, your mind and the people you love who are going through hard days before God.",
  p:"Be with me in my body and in my mind, Lord. Give me strength for the day, a joyful heart and peace in the difficult moments."},
 {t:"Daily bread",v:"Feed me with food convenient for me.",ref:"Proverbs 30:8",
  focus:"Today, bring your work, your plans and your daily needs before God.",
  p:"Bless the work of my hands, Lord. Give me wisdom with what I have, and gratitude for the bread of each day."},
 {t:"Family",v:"Except the LORD build the house, they labour in vain that build it.",ref:"Psalm 127:1",
  focus:"Today, say the name of each person in your family as you pray.",
  p:"Build my house, Lord. Bring peace to my home, heal what was wounded between us, and cover each one of my family with Your care."},
 {t:"Gratitude",v:"Blessed be the LORD, that hath given rest unto his people… there hath not failed one word of all his good promise.",ref:"1 Kings 8:56",
  focus:"On the seventh day God rested. Today, thank Him for what He has done and for what He is still doing.",
  p:"Today I thank You before I see everything. I trust that not one of Your good promises will fail me."}
];

const MANUSCRIPT = [
 {t:"The Beginning of Wisdom",s:"Why Solomon asked for wisdom first",v:"The fear of the LORD is the beginning of wisdom: and the knowledge of the holy is understanding.",ref:"Proverbs 9:10",
  c:`When God appeared to Solomon in a dream and said, "Ask what I shall give thee," the young king did not ask for riches, long life or victory over his enemies. He asked for an understanding heart (1 Kings 3:9).

This is the first lesson of the manuscript. Before asking God to change what is around us, Solomon asked God to change what was inside him.

A heart that listens to God makes better choices with money, with family and with health. Wisdom does not remove every problem, but it shows us how to walk through each one.`,
  d:"Before every decision today, big or small, pause for three seconds and pray: \"Lord, what is wise here?\""},
 {t:"The Lesson of the Ant",s:"Faithfulness in daily work",v:"Go to the ant, thou sluggard; consider her ways, and be wise.",ref:"Proverbs 6:6",
  c:`Solomon watched the ant, which "provideth her meat in the summer, and gathereth her food in the harvest" (Proverbs 6:8). No one forces the ant to work. It prepares before the need arrives.

In Solomon's teaching, faith and effort walk together. Prayer does not replace work, and work does not replace prayer.

Pray for your day, then do your part with dedication. Small tasks done faithfully, day after day, build a life.`,
  d:"Choose one task you have been putting off. Finish it today and offer it to God."},
 {t:"A Good Name",s:"What is worth more than riches",v:"A good name is rather to be chosen than great riches, and loving favour rather than silver and gold.",ref:"Proverbs 22:1",
  c:`Solomon was the richest king of his time, and yet he wrote that a good name is worth more than great riches.

A good name is built slowly: a promise kept, an honest answer, a debt paid, a kindness no one saw. It cannot be bought, and it is easily lost.

When you choose honesty, even when it costs you something, you are building what Solomon considered the greatest treasure.`,
  d:"Keep one promise today that you could easily have broken, even a small one."},
 {t:"The Generous Soul",s:"The joy of giving",v:"The liberal soul shall be made fat: and he that watereth shall be watered also himself.",ref:"Proverbs 11:25",
  c:`Solomon describes a person who waters the field of others and finds that their own heart is refreshed.

Generosity changes the one who gives. It breaks the fear of not having enough and replaces it with gratitude for what we already have.

You do not need to be rich to be generous. A visit, a phone call, a meal, an hour of your time are all ways of watering someone else's field.`,
  d:"Bless one person today without expecting anything back, and do not tell anyone about it."},
 {t:"Guard Your Heart",s:"Protection begins inside",v:"Keep thy heart with all diligence; for out of it are the issues of life.",ref:"Proverbs 4:23",
  c:`Solomon calls the heart a spring. Everything in your life flows from it: your words, your choices and your relationships.

That is why the first protection is inside. Fear, bitterness and envy are like stones thrown into the spring. They muddy everything downstream.

"Death and life are in the power of the tongue" (Proverbs 18:21). What you repeat about yourself, you begin to believe. Guard what enters your heart and what leaves your mouth.`,
  d:"Pay attention to the words you speak about yourself today. Each time you hear a complaint, replace it with a word of gratitude."},
 {t:"The Strong Tower",s:"Where the righteous run",v:"The name of the LORD is a strong tower: the righteous runneth into it, and is safe.",ref:"Proverbs 18:10",
  c:`Ancient cities had a tower at their center. When danger came, families left their fields and ran to it.

Solomon teaches that God's name is that tower. You do not need to face every battle alone. You can run to Him.

Running is an act of faith. It means admitting you cannot carry everything by yourself, and trusting the One who can.`,
  d:"When fear or bad news comes today, say His name and repeat this verse out loud."},
 {t:"A Time for Everything",s:"Trusting God's seasons",v:"To every thing there is a season, and a time to every purpose under the heaven.",ref:"Ecclesiastes 3:1",
  c:`Late in his life Solomon wrote that there is "a time to plant, and a time to pluck up that which is planted" (Ecclesiastes 3:2). A seed in the ground looks dead for a while, but it is growing where no one can see.

Many people lose heart during the hidden season. Solomon's wisdom is patience with God's calendar.

"He hath made every thing beautiful in his time" (Ecclesiastes 3:11). God's timing is not ours, and He does not forget us.`,
  d:"Write down what you are waiting for. Next to it, write: \"In His time.\" Keep this paper in your Bible."}
];

/* ---------- STATE ---------- */
const store = {
  get(k,d){try{const v=localStorage.getItem("sp:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("sp:"+k,JSON.stringify(v))}catch(e){}}
};
let done = new Set(store.get("done",[]));
let favs = new Set(store.get("favs",[]));
let fs = store.get("fs",1);
let tab = "home", cat = "strength";
const $ = s => document.querySelector(s);
const view = $("#view");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function applyFs(){document.documentElement.style.setProperty("--fs",fs)}
function bumpFs(d){fs=Math.min(1.5,Math.max(.85,+(fs+d).toFixed(2)));store.set("fs",fs);applyFs()}
["fs-down","r-fs-down"].forEach(id=>$("#"+id).onclick=()=>bumpFs(-.1));
["fs-up","r-fs-up"].forEach(id=>$("#"+id).onclick=()=>bumpFs(.1));
applyFs();

const nextDay = () => { for(let i=0;i<7;i++) if(!done.has(i)) return i; return 6; };
function paras(text){
  return text.split("\n\n").map(p => p.startsWith("~") ? `<p class="rubric">${esc(p.slice(1))}</p>` : `<p>${esc(p)}</p>`).join("");
}
function lampsHTML(){
  const n = nextDay();
  return `<div class="lamps" aria-label="${done.size} of 7 days prayed">${DAYS.map((d,i)=>
    `<div class="lamp ${done.has(i)?"lit":""} ${i===n&&!done.has(i)?"today":""}"><div class="flame"></div>${i+1}</div>`).join("")}</div>`;
}

/* ---------- VIEWS ---------- */

  const n = nextDay(), all = done.size===7;
  return `

    <div class="eyebrow">${all?"Seven days complete":`Day ${n+1} of 7 · ${DAYS[n].t}`}</div>

    <p>${all?"Keep praying daily. The more consistently you pray, the more you will notice God's hand in the details.":"A few minutes a day, for seven days, with faith. Today's lamp is waiting for you."}</p>
    ${lampsHTML()}
    <button class="cta" data-open-day="${n}">${all?"Pray again today":`Pray Day ${n+1}`}</button>
  </div>
  ${installCard()}

  <section class="block">

      <button class="pillar" data-go="lost"><span class="numeral">I</span><div><strong>The Lost Prayer of Solomon</strong><span>7-day journey · a few minutes a day</span></div><span class="chev">›</span></button>
      <button class="pillar" data-go="manuscript"><span class="numeral">II</span><div><strong>The Manuscript of Solomon</strong><span>${MANUSCRIPT.length} teachings with commentary</span></div><span class="chev">›</span></button>

function favRow(key){
  const [ci,ii]=key.split(":").map(Number), c=CATS[ci], p=c&&c.items[ii];
  if(!p) return "";
  return `<button class="row" data-prayer="${key}"><span class="fav-mark">★</span><div><strong>${esc(p.t)}</strong><span>${c.name}</span></div><span class="chev">›</span></button>`;
}

function lost(){
  const n = nextDay();
  return `
  <div class="page-title"><span class="eyebrow">Pillar I</span><h1>The Lost Prayer of Solomon</h1>
  <p class="intro">Pray once a day for seven days. Seven is the number of completion: seven days of creation, seven trumpets, seven times around Jericho. Read it slowly, aloud or in silence.</p></div>
  <section class="block">${lampsHTML()}
  <div class="list">${DAYS.map((d,i)=>`
    <button class="row" data-open-day="${i}"><span class="idx">${i+1}</span>

  ${done.size?`<button class="link" id="reset" style="justify-self:start">Restart the seven days</button>`:""}

const VIEWS = {home,lost,manuscript,prayers,bonus};
function render(){
  view.innerHTML = VIEWS[tab]();
  document.querySelectorAll("nav.bar button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));

/* ---------- SONG OF GOD (generated sacred tones) ---------- */
const DUR = 420;
let ac=null, master=null, timer=null, noteTimer=null, elapsed=0, startedAt=0, playing=false;
const SCALE = [293.66,311.13,369.99,392.00,440.00,466.16,523.25,587.33]; // D freygish (Ahava Rabbah)
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function buildAudio(){
  ac = new (window.AudioContext||window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0;
  const delay = ac.createDelay(); delay.delayTime.value = .45;
  const fb = ac.createGain(); fb.gain.value = .45;
  const lp = ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1800;
  delay.connect(fb); fb.connect(delay); delay.connect(lp); lp.connect(master); master.connect(ac.destination);
  master._delay = delay;
  [73.42,110,146.83].forEach((f,k)=>{
    const o=ac.createOscillator(), g=ac.createGain(), f2=ac.createBiquadFilter();
    o.type = k===1?"triangle":"sawtooth"; o.frequency.value=f; o.detune.value=(k-1)*4;
    f2.type="lowpass"; f2.frequency.value=380; g.gain.value=k===1?.12:.06;
    const lfo=ac.createOscillator(), lg=ac.createGain(); lfo.frequency.value=.05+k*.03; lg.gain.value=.04;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    o.connect(f2); f2.connect(g); g.connect(master); o.start();
  });
}
function chantNote(){
  if(!playing) return;
  const t=ac.currentTime, f=SCALE[Math.floor(Math.random()*SCALE.length)]*(Math.random()<.3?.5:1);
  const o=ac.createOscillator(), o2=ac.createOscillator(), g=ac.createGain();
  o.type="sine"; o2.type="triangle"; o.frequency.value=f; o2.frequency.value=f*2; o2.detune.value=6;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.09,t+1.2); g.gain.exponentialRampToValueAtTime(.0005,t+5.5);
  const g2=ac.createGain(); g2.gain.value=.25; o2.connect(g2); g2.connect(g);
  o.connect(g); g.connect(master); g.connect(master._delay); o.start(t); o2.start(t); o.stop(t+6); o2.stop(t+6);
  noteTimer = setTimeout(chantNote, 2500+Math.random()*3500);
}
function tick(){
  const now = elapsed + (playing ? ac.currentTime-startedAt : 0);
  const bar=$("#bar"), tn=$("#t-now");
  if(bar) bar.style.width = Math.min(100,now/DUR*100)+"%";
  if(tn) tn.textContent = fmt(Math.min(now,DUR));
  if(now>=DUR){ pause(true); }
}
function play(){
  if(!ac) buildAudio();
  ac.resume(); startedAt = ac.currentTime; playing = true;
  master.gain.cancelScheduledValues(ac.currentTime);
  master.gain.setValueAtTime(master.gain.value,ac.currentTime); master.gain.linearRampToValueAtTime(.8,ac.currentTime+3);
  chantNote(); timer = setInterval(tick,500); syncPlayer();
}
function pause(end){
  if(!ac||!playing) return;
  elapsed += ac.currentTime-startedAt; playing=false;
  clearTimeout(noteTimer); clearInterval(timer);
  master.gain.setValueAtTime(master.gain.value,ac.currentTime); master.gain.linearRampToValueAtTime(0,ac.currentTime+1.5);
  setTimeout(()=>{ if(!playing) ac.suspend(); },1700);
  if(end===true) elapsed=0;
  syncPlayer(); tick();
}
function syncPlayer(){
  const p=$("#player"), b=$("#play"); if(!p) return;
  p.classList.toggle("playing",playing); b.textContent = playing?"❚❚":"▶"; b.setAttribute("aria-label",playing?"Pause":"Play");
}
function bindPlayer(){
  $("#play").onclick = () => { try{ playing ? pause() : play(); }catch(e){} };
  syncPlayer(); if(ac) tick();
}

/* ---------- EVENTS ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.tab){ go(t.dataset.tab); }
  else if(t.dataset.go){ go(t.dataset.go); }
  else if(t.dataset.openDay!=null){ openDay(+t.dataset.openDay); }
  else if(t.dataset.prayer){ openPrayer(t.dataset.prayer); }
  else if(t.dataset.ms!=null){ openMs(+t.dataset.ms); }
  else if(t.dataset.recipe!=null){ openRecipe(+t.dataset.recipe); }
  else if(t.dataset.cat){ cat=t.dataset.cat; render(); }
  else if(t.id==="reset"){ done.clear(); store.set("done",[]); render(); }
  else if(t.hasAttribute("data-install")){ startInstall(); }
  else if(t.dataset.plat){ openGuide(t.dataset.plat); }
  else if(t.id==="copy-link"){ copyLink(t); }
  else if(t.id==="guide-close"){ closeReader(); }
  else if(t.id==="fab-support"){ openSupport(); }
  else if(t.id==="copy-email"){ copyEmail(t); }
  else if(t.id==="support-install"){ openGuide(IS_IOS ? "ios" : IS_ANDROID ? "android" : "computer"); }
});

function openGuide(plat){

  const actions = installPrompt && plat !== "ios"
    ? `<button class="btn primary" data-install>Install now</button>`
    : `<button class="btn primary" id="guide-close">Got it</button>`;

async function copyLink(btn){
  const url = location.href.split("?")[0];
  try{ await navigator.clipboard.writeText(url); btn.textContent = "Copied"; }
  catch(e){
    const r = document.createRange(), code = btn.previousElementSibling; r.selectNodeContents(code);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected";
  }
}
